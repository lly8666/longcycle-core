name: Storage DDR5/device revision Grounded Evidence

on:
  push:
    branches:
      - design/industry-memory
    paths:
      - '.github/workflows/storage-ddr5-device-revision-grounded-evidence.yml'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/ddr5-platform-device-forecast-revision-grounded-evidence-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/orchestration/ddr5-platform-device-forecast-revision-orchestration-v2.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-AMD-2022-11-10-EPYC4-DDR5-ENABLEMENT-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-MICRON-2023-01-10-DDR5-XEON4-VALIDATION-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-MICRON-2024-05-01-128GB-DDR5-SHIP-QUALIFY-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-GARTNER-2024-03-26-DEVICE-FORECAST-REVISION-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-GARTNER-2024-05-01-DEVICE-FORECAST-REVISION-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-GARTNER-2025-01-15-PC-2024-PRELIMINARY-OUTCOME-v1.json'
      - 'scripts/execute_grounded_evidence_spec.py'
  pull_request:
    paths:
      - '.github/workflows/storage-ddr5-device-revision-grounded-evidence.yml'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/ddr5-platform-device-forecast-revision-grounded-evidence-v1.json'
      - 'scripts/execute_grounded_evidence_spec.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.artifacts/storage-ddr5-device-blobs
      SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/ddr5-platform-device-forecast-revision-grounded-evidence-v1.json
      OUTPUT: ${{ github.workspace }}/.artifacts/storage-ddr5-device-revision-execution.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,postgres,s3,duckdb]'
      - name: Grounded Evidence regression tests
        run: >-
          python -m pytest -q
          tests/test_evidence_recording.py
          tests/test_json_evidence_recording.py
          tests/test_research_orchestration.py
          tests/test_materialized_source_representation.py
      - name: Migrate database
        run: longcycle --json db upgrade
      - name: Execute Grounded Evidence through normal archive path
        run: >-
          python scripts/execute_grounded_evidence_spec.py
          "$SPEC"
          --material-root "$GITHUB_WORKSPACE"
          --output "$OUTPUT"
      - name: Assert Evidence-only acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ["OUTPUT"]).read_text(encoding="utf-8"))
          assert payload["ok"] is True, payload
          acceptance = payload["result"]["acceptance"]
          assert acceptance == {
              "persisted_document_versions": 6,
              "persisted_evidence_fragments": 9,
              "fact_assertions_created": 0,
              "judgment_assertions_created": 0,
          }, acceptance
          print("STORAGE_DDR5_DEVICE_EVIDENCE_PASS", acceptance)
          PY
      - name: Upload execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: storage-ddr5-device-revision-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 7
