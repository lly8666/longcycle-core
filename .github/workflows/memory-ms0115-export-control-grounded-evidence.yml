name: Memory MS-0115 export-control Grounded Evidence

on:
  push:
    branches:
      - design/industry-memory
    paths:
      - '.github/workflows/memory-ms0115-export-control-grounded-evidence.yml'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-SKHYNIX-2019-04-18-WUXI-DRAM-TECH-MIGRATION-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-SAMSUNG-2014-05-09-XIAN-NAND-FAB-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-BIS-2022-10-07-PRC-MEMORY-FAB-THRESHOLDS-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-BIS-2023-10-13-KOREA-MEMORY-VEU-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/captures/CAP-BIS-2025-08-29-PRC-VEU-REVOCATION-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/ms0115-export-control-memory-supply-grounded-evidence-v1.json'
      - 'scripts/execute_grounded_evidence_spec.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.artifacts/memory-ms0115-export-control-blobs
      SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/ms0115-export-control-memory-supply-grounded-evidence-v1.json
      OUTPUT: ${{ github.workspace }}/.artifacts/memory-ms0115-export-control-execution.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev,postgres,s3,duckdb]'

      - name: Grounded Evidence regression tests
        run: >-
          python -m pytest -q
          tests/test_evidence_recording.py
          tests/test_json_evidence_recording.py
          tests/test_research_orchestration.py
          tests/test_materialized_source_representation.py

      - name: Migrate database
        run: longcycle --json db upgrade

      - name: Execute Grounded Evidence through normal archive path
        run: >-
          python scripts/execute_grounded_evidence_spec.py
          "$SPEC"
          --material-root "$GITHUB_WORKSPACE"
          --output "$OUTPUT"

      - name: Assert Evidence-only acceptance, policy-state separation and no-lookahead metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["OUTPUT"]).read_text(encoding="utf-8"))
          assert payload["ok"] is True, payload
          result = payload["result"]
          assert result["task_id"] == "EVT-MEMORY-SEMICONDUCTORS-MS0115-EXPORT-CONTROL-MEMORY-SUPPLY-001"
          acceptance = result["acceptance"]
          assert acceptance["persisted_document_versions"] == 5, acceptance
          assert acceptance["persisted_evidence_fragments"] == 7, acceptance
          assert acceptance["fact_assertions_created"] == 0, acceptance
          assert acceptance["judgment_assertions_created"] == 0, acceptance
          assert len(result["documents"]) == 5
          assert len(result["fragments"]) == 7

          roles = {item["claim_context"]["claim_role"] for item in result["fragments"]}
          assert roles == {
              "memory_fab_technology_migration_equipment_space_requirement",
              "operating_prc_nand_fab_baseline",
              "prc_dram_fab_export_control_threshold",
              "prc_nand_fab_export_control_threshold",
              "foreign_owned_prc_memory_fab_veu_authorization",
              "post_veu_existing_fab_operation_license_intent",
              "post_veu_no_capacity_or_technology_upgrade_license_intent",
          }, roles

          spec = json.loads(Path(os.environ["SPEC"]).read_text(encoding="utf-8"))
          by_role = {
              item["claim_context"]["claim_role"]: item["claim_context"]["known_time"]["upper_bound"]
              for item in spec["fragments"]
          }
          cutoff = "2024-12-31T23:59:59Z"
          assert by_role["foreign_owned_prc_memory_fab_veu_authorization"] <= cutoff
          assert by_role["post_veu_existing_fab_operation_license_intent"] > cutoff
          assert by_role["post_veu_no_capacity_or_technology_upgrade_license_intent"] > cutoff
          assert by_role["post_veu_existing_fab_operation_license_intent"] == by_role["post_veu_no_capacity_or_technology_upgrade_license_intent"]
          print("MEMORY_MS0115_EXPORT_CONTROL_EVIDENCE_PASS")
          PY

      - name: Upload execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: memory-ms0115-export-control-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 7
