name: Acquire EVT-005 FMC counterexample once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  ACTIVE_REF: design/industry-memory
  EXPECTED_HEAD: aa19c5a36cce0e7838fcf54676f8655f4ec430e6
  RELEASE_TAG: longcycle-dev-binary-cache

jobs:
  acquire:
    if: github.event.issue.title == '[longcycle-evt005-fmc-counterexample-acquire-v1]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded PDF reader
        run: python -m pip install --disable-pip-version-check --quiet pypdf==6.15.0

      - name: Acquire and semantically verify FMC sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p acquired
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          import urllib.request
          from html import unescape
          from pathlib import Path
          from pypdf import PdfReader

          USER_AGENT = 'Mozilla/5.0 (compatible; LongcycleCollector/0.1; +https://github.com/lly8666/longcycle-core)'
          ITEMS = [
              {
                  'key': 'fmc-2017-annual-report',
                  'url': 'https://www.annualreports.com/HostedData/AnnualReportArchive/f/NYSE_FMC_2017.PDF',
                  'kind': 'pdf',
                  'content_type_hint': 'application/pdf',
                  'upstream_system': 'FMC Corporation 2017 Annual Report / SEC Form 10-K filing identity',
                  'upstream_external_id': '0000037785-18-000019',
                  'upstream_title': 'FMC Corporation 2017 Annual Report',
                  'required_phrases': [
                      'increased our lithium hydroxide production capacity by 90 percent in 2017',
                      'adding 9,000 metric tons of capacity at a new location in China',
                      'completed ahead of schedule',
                      'received full qualifications by our key customers',
                      'annual lithium hydroxide capacity to 19,000 metric tons',
                  ],
              },
              {
                  'key': 'fmc-2018q1-results',
                  'url': 'https://investors.fmc.com/news/news-details/2018/FMC-Corporation-Announces-First-Quarter-2018-Results/default.aspx',
                  'kind': 'html',
                  'content_type_hint': 'text/html',
                  'upstream_system': 'FMC Corporation investor relations',
                  'upstream_external_id': '2018-05-02-Q1-results',
                  'upstream_title': 'FMC Corporation Announces First Quarter 2018 Results',
                  'required_phrases': [
                      'FMC Corporation Announces First Quarter 2018 Results',
                      'lithium hydroxide expansion in China',
                      'near doubling of Lithium segment EBITDA year-over-year',
                      'Higher volume from debottlenecking projects in Argentina and the hydroxide expansion in China',
                  ],
              },
          ]

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': USER_AGENT,
                  'Accept': '*/*',
                  'Accept-Language': 'en-US,en;q=0.8',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read(), response.geturl(), response.status, dict(response.headers.items())

          def html_text(raw):
              decoded = raw.decode('utf-8', errors='replace')
              decoded = re.sub(r'(?is)<(script|style|noscript).*?>.*?</\\1>', ' ', decoded)
              return ' '.join(unescape(re.sub(r'<[^>]+>', ' ', decoded)).split())

          def pdf_text(raw):
              if not raw.startswith(b'%PDF-'):
                  raise ValueError('payload is not PDF')
              reader = PdfReader(io.BytesIO(raw))
              return ' '.join(' '.join((page.extract_text() or '').split()) for page in reader.pages)

          rows = []
          for item in ITEMS:
              base = {
                  'key': item['key'],
                  'requested_url': item['url'],
                  'upstream_announcement': {
                      'issuer': 'FMC Corporation',
                      'system': item['upstream_system'],
                      'external_id': item['upstream_external_id'],
                      'title': item['upstream_title'],
                  },
              }
              try:
                  raw, final_url, status, headers = fetch(item['url'])
                  if status != 200:
                      raise ValueError(f'unexpected HTTP {status}')
                  text = pdf_text(raw) if item['kind'] == 'pdf' else html_text(raw)
                  lowered = text.lower()
                  missing = [p for p in item['required_phrases'] if p.lower() not in lowered]
                  if missing:
                      raise ValueError(f'semantic identity/claim phrases missing: {missing}')
                  suffix = '.pdf' if item['kind'] == 'pdf' else '.html'
                  raw_path = Path('acquired') / f"{item['key']}{suffix}"
                  raw_path.write_bytes(raw)
                  text_path = Path('acquired') / f"{item['key']}-visible.txt"
                  text_path.write_text(text, encoding='utf-8')
                  rows.append({
                      **base,
                      'ok': True,
                      'final_url': final_url,
                      'status': status,
                      'content_type': headers.get('Content-Type') or headers.get('content-type') or item['content_type_hint'],
                      'raw_sha256': hashlib.sha256(raw).hexdigest(),
                      'raw_bytes': len(raw),
                      'visible_text_sha256_acquisition_only': hashlib.sha256(text.encode('utf-8')).hexdigest(),
                      'visible_text_bytes': len(text.encode('utf-8')),
                      'verified_phrases': item['required_phrases'],
                  })
              except Exception as exc:
                  rows.append({**base, 'ok': False, 'error': f'{type(exc).__name__}: {exc}'})

          payload = {
              'schema_version': 'longcycle-approved-source-acquisition/v1',
              'task_id': 'EVT-005-EFFECTIVE-SUPPLY-VS-NAMEPLATE',
              'active_head_sha': 'aa19c5a36cce0e7838fcf54676f8655f4ec430e6',
              'success_count': sum(1 for row in rows if row['ok']),
              'rows': rows,
          }
          Path('acquired/acquisition.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          if payload['success_count'] != len(ITEMS):
              raise SystemExit('not all FMC source payloads passed acquisition/semantic verification')
          PY

      - name: Build deterministic immutable acquisition pack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          out = Path(f"longcycle-evt005-fmc-counterexample-acquisition-run{__import__('os').environ['GITHUB_RUN_ID']}.zip")
          epoch = (2026, 8, 22, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(Path('acquired').rglob('*')):
                  if not path.is_file():
                      continue
                  info = zipfile.ZipInfo(str(path.relative_to('acquired')), date_time=epoch)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  zf.writestr(info, path.read_bytes())
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('release-asset.json').write_text(json.dumps({
              'file_name': out.name,
              'size_bytes': out.stat().st_size,
              'sha256': digest,
          }, indent=2) + '\n')
          print(Path('release-asset.json').read_text())
          PY

      - name: Upload to shared development Release and download-back verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          name="$(python -c 'import json; print(json.load(open("release-asset.json"))["file_name"])')"
          expected="$(python -c 'import json; print(json.load(open("release-asset.json"))["sha256"])')"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
            echo "refusing to overwrite existing immutable Release asset: $name" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY"
          mkdir -p verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir verify
          actual="$(sha256sum "verify/$name" | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Report acquisition result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ -f acquired/acquisition.json && -f release-asset.json ]]; then
            body=$(printf 'EVT005_FMC_COUNTEREXAMPLE_ACQUIRE_PASS head=%s run_id=%s release=%s\n\n```json\n%s\n%s\n```' "$EXPECTED_HEAD" "$GITHUB_RUN_ID" "$RELEASE_TAG" "$(cat acquired/acquisition.json)" "$(cat release-asset.json)")
          else
            body="EVT005_FMC_COUNTEREXAMPLE_ACQUIRE_FAIL head=$EXPECTED_HEAD run_id=$GITHUB_RUN_ID"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
