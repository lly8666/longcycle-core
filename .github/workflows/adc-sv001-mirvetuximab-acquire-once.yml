name: Acquire ADC SV-001 mirvetuximab sources once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  ACTIVE_REF: design/industry-memory
  EXPECTED_HEAD: 624aaeec84f73441577c47be0e446a5a884e7e40
  RELEASE_TAG: longcycle-dev-binary-cache
  TRIGGER_TITLE: '[longcycle-adc-sv001-mirvetuximab-acquire-v1]'

jobs:
  acquire:
    if: github.event.issue.title == '[longcycle-adc-sv001-mirvetuximab-acquire-v1]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire and semantically verify SV-001 primary sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p acquired
          python - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from html import unescape
          from pathlib import Path

          USER_AGENT = 'LongcycleCollector/0.1 lly8666@users.noreply.github.com'
          ITEMS = [
              {
                  'key': 'immunogen-forward1-2019-03-01',
                  'url': 'https://news.abbvie.com/2019-03-01-ImmunoGen-Announces-Top-Line-Results-from-Phase-3-FORWARD-I-Study-of-Mirvetuximab-Soravtansine-in-Ovarian-Cancer',
                  'upstream_system': 'ImmunoGen historical press release archived by AbbVie',
                  'upstream_external_id': '2019-03-01-FORWARD-I-top-line',
                  'upstream_title': 'ImmunoGen Announces Top-Line Results from Phase 3 FORWARD I Study of Mirvetuximab Soravtansine in Ovarian Cancer',
                  'required_phrases': [
                      'Trial Did Not Meet Primary Endpoint of Progression-Free Survival',
                      'FORWARD I',
                      'did not meet its primary endpoint of progression-free survival',
                  ],
              },
              {
                  'key': 'immunogen-forward1-exploratory-sec-2019-09-30',
                  'url': 'https://www.sec.gov/Archives/edgar/data/855654/000155837019008729/imgn-20190929ex993a7ed95.htm',
                  'upstream_system': 'SEC EDGAR / ImmunoGen filed Exhibit 99.3',
                  'upstream_external_id': '0001558370-19-008729-ex99.3',
                  'upstream_title': 'FORWARD I: Full Data and Exploratory Analyses',
                  'required_phrases': [
                      'Change in scoring method from PS2+ to 10X',
                      'FRα high',
                      'MIRASOL',
                  ],
              },
              {
                  'key': 'fda-elahere-accelerated-2022-11-14',
                  'url': 'https://www.fda.gov/drugs/resources-information-approved-drugs/fda-grants-accelerated-approval-mirvetuximab-soravtansine-gynx-fra-positive-platinum-resistant',
                  'upstream_system': 'U.S. Food and Drug Administration',
                  'upstream_external_id': '2022-11-14-elahere-accelerated',
                  'upstream_title': 'FDA grants accelerated approval to mirvetuximab soravtansine-gynx',
                  'required_phrases': [
                      'November 14, 2022',
                      'granted accelerated approval to mirvetuximab soravtansine-gynx',
                      'VENTANA FOLR1',
                  ],
              },
              {
                  'key': 'fda-elahere-regular-2024-03-22',
                  'url': 'https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-mirvetuximab-soravtansine-gynx-fra-positive-platinum-resistant-epithelial-ovarian',
                  'upstream_system': 'U.S. Food and Drug Administration',
                  'upstream_external_id': '2024-03-22-elahere-regular',
                  'upstream_title': 'FDA approves mirvetuximab soravtansine-gynx for FRalpha positive platinum-resistant ovarian cancer',
                  'required_phrases': [
                      'March 22, 2024',
                      'previously received accelerated approval',
                      'MIRASOL, NCT04209855',
                  ],
              },
          ]

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': USER_AGENT,
                  'Accept': 'text/html,application/xhtml+xml,*/*;q=0.8',
                  'Accept-Language': 'en-US,en;q=0.8',
              })
              with urllib.request.urlopen(request, timeout=90) as response:
                  return response.read(), response.geturl(), response.status, dict(response.headers.items())

          def html_text(raw):
              decoded = raw.decode('utf-8', errors='replace')
              decoded = re.sub(r'(?is)<(script|style|noscript).*?>.*?</\\1>', ' ', decoded)
              return ' '.join(unescape(re.sub(r'<[^>]+>', ' ', decoded)).split())

          rows = []
          for item in ITEMS:
              base = {
                  'key': item['key'],
                  'requested_url': item['url'],
                  'upstream_announcement': {
                      'system': item['upstream_system'],
                      'external_id': item['upstream_external_id'],
                      'title': item['upstream_title'],
                  },
              }
              try:
                  raw, final_url, status, headers = fetch(item['url'])
                  if status != 200:
                      raise ValueError(f'unexpected HTTP {status}')
                  text = html_text(raw)
                  normalized = text.casefold()
                  missing = [p for p in item['required_phrases'] if p.casefold() not in normalized]
                  if missing:
                      raise ValueError(f'semantic identity/claim phrases missing: {missing}')
                  raw_path = Path('acquired') / f"{item['key']}.html"
                  raw_path.write_bytes(raw)
                  text_path = Path('acquired') / f"{item['key']}-visible.txt"
                  text_path.write_text(text, encoding='utf-8')
                  rows.append({
                      **base,
                      'ok': True,
                      'final_url': final_url,
                      'status': status,
                      'content_type': headers.get('Content-Type') or headers.get('content-type') or 'text/html',
                      'raw_sha256': hashlib.sha256(raw).hexdigest(),
                      'raw_bytes': len(raw),
                      'visible_text_sha256_acquisition_only': hashlib.sha256(text.encode('utf-8')).hexdigest(),
                      'visible_text_bytes': len(text.encode('utf-8')),
                      'verified_phrases': item['required_phrases'],
                  })
              except Exception as exc:
                  rows.append({**base, 'ok': False, 'error': f'{type(exc).__name__}: {exc}'})

          payload = {
              'schema_version': 'longcycle-approved-source-acquisition/v1',
              'task_id': 'ADC-SV-001-MIRVETUXIMAB-ELA-HERE',
              'active_head_sha': '624aaeec84f73441577c47be0e446a5a884e7e40',
              'source_role': 'candidate primary/authoritative payload acquisition for later claim-scoped Evidence recording',
              'success_count': sum(1 for row in rows if row['ok']),
              'rows': rows,
          }
          Path('acquired/acquisition.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          if payload['success_count'] != len(ITEMS):
              raise SystemExit('not all SV-001 source payloads passed acquisition/semantic verification')
          PY

      - name: Build deterministic immutable acquisition pack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          out = Path(f"longcycle-adc-sv001-mirvetuximab-acquisition-run{os.environ['GITHUB_RUN_ID']}.zip")
          epoch = (2026, 8, 22, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(Path('acquired').rglob('*')):
                  if not path.is_file():
                      continue
                  info = zipfile.ZipInfo(str(path.relative_to('acquired')), date_time=epoch)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  zf.writestr(info, path.read_bytes())
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('release-asset.json').write_text(json.dumps({
              'file_name': out.name,
              'size_bytes': out.stat().st_size,
              'sha256': digest,
          }, indent=2) + '\n')
          print(Path('release-asset.json').read_text())
          PY

      - name: Upload to shared development Release and download-back verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          name="$(python -c 'import json; print(json.load(open("release-asset.json"))["file_name"])')"
          expected="$(python -c 'import json; print(json.load(open("release-asset.json"))["sha256"])')"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
            echo "refusing to overwrite existing immutable Release asset: $name" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY"
          mkdir -p verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir verify
          actual="$(sha256sum "verify/$name" | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Report acquisition result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ -f acquired/acquisition.json && -f release-asset.json ]]; then
            body=$(printf 'ADC_SV001_ACQUIRE_PASS head=%s run_id=%s release=%s\n\n```json\n%s\n%s\n```' "$EXPECTED_HEAD" "$GITHUB_RUN_ID" "$RELEASE_TAG" "$(cat acquired/acquisition.json)" "$(cat release-asset.json)")
          else
            body="ADC_SV001_ACQUIRE_FAIL head=$EXPECTED_HEAD run_id=$GITHUB_RUN_ID"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
