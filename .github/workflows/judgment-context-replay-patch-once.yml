name: Patch judgment context replay once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  ACTIVE_REF: design/industry-memory
  LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
  LONGCYCLE_BLOB_BACKEND: filesystem
  LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.longcycle/action-blobs

jobs:
  patch:
    if: github.event.issue.title == '[longcycle-judgment-context-replay-v1]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply and verify bounded replay patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/judgment-context-replay.log) 2>&1
          python scripts/_patch_judgment_context_replay_once.py
          rm scripts/_patch_judgment_context_replay_once.py
          python -m pip install -e '.[dev,postgres,duckdb,s3]'
          python -m compileall -q src scripts tests
          python scripts/repair_memory.py audit
          longcycle --json db upgrade
          python scripts/smoke_postgres_epistemic.py
          mypy src
          pytest -q
          git diff --check

      - name: Commit and push active branch
        id: push
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name longcycle-judgment-context-replay
          git config user.email actions@users.noreply.github.com
          git add src scripts tests
          git commit -m 'feat: replay judgment rationale and revision context'
          git push origin HEAD:${ACTIVE_REF}
          git rev-parse HEAD | tee /tmp/judgment-context-replay-sha.txt

      - name: Report actual result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          if [[ "$APPLY_OUTCOME" == success && "$PUSH_OUTCOME" == success ]]; then
            sha="$(cat /tmp/judgment-context-replay-sha.txt)"
            body="JUDGMENT_CONTEXT_REPLAY_PASS pushed_sha=$sha run_id=$GITHUB_RUN_ID"
          else
            tail_text="$(tail -n 260 /tmp/judgment-context-replay.log 2>/dev/null || true)"
            body=$(printf 'JUDGMENT_CONTEXT_REPLAY_FAIL apply=%s push=%s run_id=%s\n\n```text\n%s\n```' "$APPLY_OUTCOME" "$PUSH_OUTCOME" "$GITHUB_RUN_ID" "$tail_text")
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
