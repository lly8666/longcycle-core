name: RIGHTS-BD-007 faithful-capture Evidence probe

on:
  push:
    branches:
      - design/industry-memory
    paths:
      - '.github/workflows/rights-bd-007-evidence-probe.yml'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/source_captures/RIGHTS-BD-007/bms-2023-12-11-joint-announcement.capture.txt'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/source_captures/RIGHTS-BD-007/sec-bms-2023-10k-systimmune-note.capture.txt'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/source_captures/RIGHTS-BD-007/source-pack.zip'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/analysis/RIGHTS-BD-007-grounded-evidence-spec-v1.json'
      - 'scripts/execute_grounded_evidence_spec.py'
      - 'src/longcycle/adapters/sources/materialized.py'
  pull_request:
    paths:
      - '.github/workflows/rights-bd-007-evidence-probe.yml'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/source_captures/RIGHTS-BD-007/bms-2023-12-11-joint-announcement.capture.txt'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/source_captures/RIGHTS-BD-007/sec-bms-2023-10k-systimmune-note.capture.txt'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/source_captures/RIGHTS-BD-007/source-pack.zip'
      - 'research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/analysis/RIGHTS-BD-007-grounded-evidence-spec-v1.json'
      - 'scripts/execute_grounded_evidence_spec.py'
      - 'src/longcycle/adapters/sources/materialized.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.artifacts/rights-bd-007-blobs
      SPEC: research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/analysis/RIGHTS-BD-007-grounded-evidence-spec-v1.json
      MATERIAL_ROOT: research_data/memory/innovative-drugs-adc/2026-08-22-gpt-5.6-sol/source_captures/RIGHTS-BD-007
      OUTPUT: .artifacts/RIGHTS-BD-007-grounded-evidence-execution.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev,postgres,s3,duckdb]'

      - name: Migrate database
        run: longcycle --json db upgrade

      - name: Verify capture pack and spec pins
        shell: bash
        run: |
          set -euo pipefail

          check_sha() {
            local path="$1"
            local expected="$2"
            local actual
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Required capture material is missing"
              return 1
            fi
            actual="$(sha256sum "$path" | awk '{print $1}')"
            echo "RIGHTS_BD_007_SHA path=$path actual=$actual expected=$expected"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$path::SHA-256 mismatch actual=$actual expected=$expected"
              return 1
            fi
          }

          check_sha "$MATERIAL_ROOT/bms-2023-12-11-joint-announcement.capture.txt" "fb74a403e44d8287dc7ca934ce22bbc1856f531cdd3f94d0ac752a403bf6d186"
          check_sha "$MATERIAL_ROOT/sec-bms-2023-10k-systimmune-note.capture.txt" "d2089b07ac157883bc482bff88114d11ef038f8cb350c757a09d0701d30b8de3"
          check_sha "$MATERIAL_ROOT/source-pack.zip" "0ac2cc7e3d769e51b308f1c7ed694432e1b6b6d2c89b50998652fee777554350"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import os

          spec = json.loads(Path(os.environ['SPEC']).read_text(encoding='utf-8'))
          root = Path(os.environ['MATERIAL_ROOT'])
          by_document = {row['key']: row for row in spec['documents']}
          for row in by_document.values():
              material = root / row['material_path']
              digest = hashlib.sha256(material.read_bytes()).hexdigest()
              assert digest == row['expected_sha256'], (material, digest, row['expected_sha256'])
              provenance = row['retrieval_provenance']
              assert provenance['capture_mode'] == 'verbatim_visible_text_transcription'
              assert provenance['transport_is_not_source_authority'] is True
          material_by_key = {
              'bms-announcement-capture': (root / by_document['bms-announcement-capture']['material_path']).read_text(encoding='utf-8'),
              'sec-10k-capture': (root / by_document['sec-10k-capture']['material_path']).read_text(encoding='utf-8'),
          }
          for fragment in spec['fragments']:
              assert fragment['excerpt'] in material_by_key[fragment['document_key']], fragment['fragment_key']
          print('RIGHTS_BD_007_CAPTURE_INTEGRITY_PASS')
          PY

      - name: Execute Grounded Evidence through normal archive path
        run: >-
          python scripts/execute_grounded_evidence_spec.py
          "$SPEC"
          --material-root "$MATERIAL_ROOT"
          --output "$OUTPUT"

      - name: Assert epistemic boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          payload = json.load(open(os.environ['OUTPUT'], encoding='utf-8'))
          assert payload['ok'] is True, payload
          result = payload['result']
          assert len(result['documents']) == 2, result
          assert len(result['fragments']) == 2, result
          assert result['acceptance'] == {
              'persisted_document_versions': 2,
              'persisted_evidence_fragments': 2,
              'fact_assertions_created': 0,
              'judgment_assertions_created': 0,
          }, result['acceptance']
          documents = {row['document_key']: row for row in result['documents']}
          assert documents['bms-announcement-capture']['retrieval_provenance']['capture_mode'] == 'verbatim_visible_text_transcription'
          assert documents['sec-10k-capture']['retrieval_provenance']['capture_mode'] == 'verbatim_visible_text_transcription'
          assert documents['bms-announcement-capture']['source_authority_profiles'][0]['authority_class'] == 'primary_self_statement'
          assert documents['sec-10k-capture']['source_authority_profiles'][0]['authority_class'] == 'authoritative_primary'
          print('RIGHTS_BD_007_GROUNDED_EVIDENCE_PASS')
          PY

      - name: Upload Evidence execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rights-bd-007-grounded-evidence-${{ github.run_id }}
          path: |
            .artifacts/RIGHTS-BD-007-grounded-evidence-execution.json
            .artifacts/rights-bd-007-blobs
          if-no-files-found: warn
          retention-days: 7

      - name: Report exact-head runtime receipt
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          output_sha="missing"
          acceptance="unavailable"
          if [[ -f "$OUTPUT" ]]; then
            output_sha="$(sha256sum "$OUTPUT" | awk '{print $1}')"
            acceptance="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ['OUTPUT']).read_text(encoding='utf-8'))
          result = payload.get('result') or {}
          print(json.dumps(result.get('acceptance'), sort_keys=True, separators=(',', ':')))
          PY
          )"
          fi
          receipt=.artifacts/RIGHTS-BD-007-runtime-receipt.md
          cat > "$receipt" <<EOF
          [RIGHTS-BD-007-EVIDENCE-PROBE]

          - head_sha: \`$HEAD_SHA\`
          - run_id: \`$RUN_ID\`
          - job_status: \`$JOB_STATUS\`
          - output_sha256: \`$output_sha\`
          - acceptance: \`$acceptance\`
          - run_url: https://github.com/$REPOSITORY/actions/runs/$RUN_ID
          EOF
          gh issue comment 2 --repo "$REPOSITORY" --body-file "$receipt"
