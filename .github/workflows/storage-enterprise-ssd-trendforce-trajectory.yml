name: Storage enterprise SSD TrendForce typed trajectory

on:
  push:
    branches:
      - design/industry-memory
    paths:
      - '.github/workflows/storage-enterprise-ssd-trendforce-trajectory.yml'
      - 'migrations/0038_storage_market_trajectory_predicates.sql'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/enterprise-ssd-trendforce-market-trajectory-grounded-evidence-v2.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/enterprise-ssd-trendforce-market-judgment-projection-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/reality/enterprise-ssd-trendforce-market-reality-projection-v1.json'
      - 'src/longcycle/application/judgment_projection.py'
      - 'src/longcycle/application/reality_projection.py'
      - 'scripts/execute_grounded_evidence_spec.py'
      - 'scripts/execute_grounded_judgment_persistence.py'
      - 'scripts/execute_grounded_reality_projection.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trajectory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.artifacts/storage-enterprise-ssd-trendforce-trajectory-blobs
      EVIDENCE_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/enterprise-ssd-trendforce-market-trajectory-grounded-evidence-v2.json
      JUDGMENT_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/enterprise-ssd-trendforce-market-judgment-projection-v1.json
      REALITY_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/reality/enterprise-ssd-trendforce-market-reality-projection-v1.json
      EVIDENCE_OUTPUT: ${{ github.workspace }}/.artifacts/storage-enterprise-ssd-trendforce-evidence.json
      JUDGMENT_OUTPUT: ${{ github.workspace }}/.artifacts/storage-enterprise-ssd-trendforce-judgments.json
      REALITY_OUTPUT: ${{ github.workspace }}/.artifacts/storage-enterprise-ssd-trendforce-reality.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev,postgres,s3,duckdb]'

      - name: Typed trajectory regression tests
        run: >-
          python -m pytest -q
          tests/test_judgment_projection.py
          tests/test_reality_projection.py
          tests/test_postgres_mapping.py
          tests/test_evidence_recording.py
          tests/test_json_evidence_recording.py

      - name: Migrate fresh PostgreSQL
        run: longcycle --json db upgrade

      - name: Assert storage market semantic catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import psycopg
          from psycopg.rows import dict_row

          expected = {
              'storage.qlc_enterprise_ssd_bit_shipments': 'EB',
              'storage.enterprise_ssd_procurement_volume_qoq_growth': 'ratio',
              'storage.enterprise_ssd_revenue_qoq_growth': 'ratio',
              'storage.enterprise_ssd_major_supplier_quarterly_revenue': 'USD',
          }
          with psycopg.connect(os.environ['LONGCYCLE_DATABASE_URL'], row_factory=dict_row) as conn:
              rows = conn.execute(
                  "SELECT code,canonical_unit_code,value_kinds,temporal_mode,required_dimensions,allowed_dimensions FROM core.predicate_definitions WHERE code = ANY(%s) AND active",
                  (list(expected),),
              ).fetchall()
          assert len(rows) == 4, rows
          for row in rows:
              assert row['canonical_unit_code'] == expected[row['code']], row
              assert row['value_kinds'] == ['numeric'], row
              assert row['temporal_mode'] == 'period', row
              assert row['required_dimensions'] == ['statistical_scope'], row
              assert row['allowed_dimensions'] == ['statistical_scope'], row
          print('STORAGE_TRENDFORCE_SEMANTIC_CATALOG_PASS')
          PY

      - name: Rebuild TrendForce Grounded Evidence
        run: >-
          python scripts/execute_grounded_evidence_spec.py "$EVIDENCE_SPEC"
          --material-root "$GITHUB_WORKSPACE"
          --output "$EVIDENCE_OUTPUT"

      - name: Persist contemporaneous TrendForce Judgments
        run: >-
          python scripts/execute_grounded_judgment_persistence.py
          "$JUDGMENT_SPEC" "$EVIDENCE_OUTPUT"
          --output "$JUDGMENT_OUTPUT"

      - name: Persist source-scoped TrendForce Reality
        run: >-
          python scripts/execute_grounded_reality_projection.py
          "$REALITY_SPEC" "$EVIDENCE_OUTPUT"
          --output "$REALITY_OUTPUT"

      - name: Assert typed point-in-time trajectory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row

          judgments = json.loads(Path(os.environ['JUDGMENT_OUTPUT']).read_text(encoding='utf-8'))
          reality = json.loads(Path(os.environ['REALITY_OUTPUT']).read_text(encoding='utf-8'))

          assert judgments['verification']['judgment_count'] == 2, judgments
          by_key = {row['metadata']['judgment_key']: row for row in judgments['judgments']}
          april = by_key['trendforce-qlc-enterprise-ssd-30eb-2024-04']
          august = by_key['trendforce-ai-related-ssd-gt45eb-2024-08']
          assert april['value_kind'] == 'numeric'
          assert Decimal(str(april['value_numeric'])) == Decimal('30')
          assert april['unit_code'] == 'EB'
          assert april['predicate_code'] == 'storage.qlc_enterprise_ssd_bit_shipments'
          assert april['dimensions_complete'] is True
          assert april['first_known_at'] == '2024-04-24T00:00:00Z'
          assert august['value_kind'] == 'text'
          assert august['value_text'] == 'greater than 45 EB'
          assert august['value_numeric'] is None
          assert august['predicate_code'] is None
          assert august['first_known_at'] == '2024-08-13T00:00:00Z'
          assert august['metadata']['numeric_qualifier'] == 'greater_than'
          assert Decimal(str(august['metadata']['numeric_lower_bound'])) == Decimal('45')
          assert august['metadata']['numeric_lower_bound_unit'] == 'EB'

          verification = reality['verification']
          assert verification['fact_count'] == 4, verification
          assert verification['canonical_reality_count'] == 4, verification
          assert verification['all_reconciled_accept'] is True, verification
          facts = {row['fact']['metadata']['fact_key']: row['fact'] for row in reality['facts']}
          q3p = facts['trendforce-enterprise-ssd-q3-procurement-volume-qoq']
          q3r = facts['trendforce-enterprise-ssd-q3-industry-revenue-qoq']
          q4abs = facts['trendforce-enterprise-ssd-q4-major-supplier-revenue']
          q4r = facts['trendforce-enterprise-ssd-q4-major-supplier-revenue-qoq']
          assert Decimal(str(q3p['normalized_number'])) == Decimal('0.15') and q3p['normalized_unit'] == 'ratio'
          assert Decimal(str(q3r['normalized_number'])) == Decimal('0.286') and q3r['normalized_unit'] == 'ratio'
          assert Decimal(str(q4abs['normalized_number'])) == Decimal('7340000000') and q4abs['normalized_unit'] == 'USD'
          assert Decimal(str(q4r['normalized_number'])) == Decimal('-0.005') and q4r['normalized_unit'] == 'ratio'
          assert q3p['known_at'] == '2024-12-12T00:00:00Z'
          assert q3r['known_at'] == '2024-12-12T00:00:00Z'
          assert q4abs['known_at'] == '2025-03-07T00:00:00Z'
          assert q4r['known_at'] == '2025-03-07T00:00:00Z'
          assert q3r['dimensions']['statistical_scope'] != q4r['dimensions']['statistical_scope']

          ids = [row['fact']['id'] for row in reality['facts']]
          with psycopg.connect(os.environ['LONGCYCLE_DATABASE_URL'], row_factory=dict_row) as conn:
              known_by_2024 = conn.execute(
                  """
                  SELECT link.assertion_id, canonical.market_known_at
                  FROM research.canonical_fact_versions canonical
                  JOIN research.fact_resolution_assertions link
                    ON link.resolution_id = canonical.resolution_id
                   AND link.disposition = 'selected'
                  WHERE link.assertion_id = ANY(%s::uuid[])
                    AND canonical.system_to IS NULL
                    AND canonical.market_known_at <= '2024-12-31T23:59:59Z'::timestamptz
                  ORDER BY canonical.market_known_at, link.assertion_id
                  """,
                  (ids,),
              ).fetchall()
              relation_count = conn.execute(
                  "SELECT count(*) AS n FROM research.judgment_relations WHERE from_judgment_id = ANY(%s::uuid[]) OR to_judgment_id = ANY(%s::uuid[])",
                  ([row['id'] for row in judgments['judgments']], [row['id'] for row in judgments['judgments']]),
              ).fetchone()['n']
          assert len(known_by_2024) == 2, known_by_2024
          assert {str(row['assertion_id']) for row in known_by_2024} == {q3p['id'], q3r['id']}, known_by_2024
          assert relation_count == 0, relation_count
          print('STORAGE_ENTERPRISE_SSD_TRENDFORCE_TYPED_TRAJECTORY_PASS')
          PY

      - name: Upload typed trajectory receipts
        uses: actions/upload-artifact@v4
        with:
          name: storage-enterprise-ssd-trendforce-trajectory-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_OUTPUT }}
            ${{ env.JUDGMENT_OUTPUT }}
            ${{ env.REALITY_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
