name: Acquire ADC SV-004 RC48 rights and regulatory sources once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  ACTIVE_REF: design/industry-memory
  EXPECTED_HEAD: 61b5910877a50f3ee360d9cb001b262f5dc13c84
  RELEASE_TAG: longcycle-dev-binary-cache

jobs:
  acquire:
    if: github.event.issue.title == '[longcycle-adc-sv004-rc48-acquire-v2]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF extraction support
        run: python -m pip install 'pypdf==6.15.0'
      - name: Acquire and semantically verify SV-004 sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p acquired
          python - <<'PY'
          import hashlib, io, json, re, urllib.request
          from html import unescape
          from pathlib import Path
          from urllib.parse import urlsplit
          from pypdf import PdfReader

          UA = 'LongcycleCollector/0.2 lly8666@users.noreply.github.com'
          ITEMS = [
              {
                  'key': 'remegen-seagen-joint-license-release-2021',
                  'url': 'https://www.remegen.cn/uploadfile/2022/04/16/202204161020582736.pdf',
                  'retrieval_role': 'primary_joint_statement_archive',
                  'upstream_system': 'RemeGen-hosted Seagen/RemeGen joint release',
                  'upstream_external_id': '2021-08-09-disitamab-license-joint-release',
                  'upstream_title': 'Seagen and RemeGen Announce Exclusive Worldwide License and Co-Development Agreement for Disitamab Vedotin',
                  'published_date': '2021-08-09',
                  'original_url': 'https://www.remegen.cn/uploadfile/2022/04/16/202204161020582736.pdf',
                  'required_phrases': ['exclusive worldwide licensing agreement', 'outside of RemeGen’s territory', 'Asia, excluding Japan and Singapore', 'Seagen will lead global development'],
              },
              {
                  'key': 'remegen-gastric-approval-2021-06-09',
                  'url': 'https://www.remegen.com/index.php?cid=115&id=386&v=show',
                  'retrieval_role': 'primary_self_statement',
                  'upstream_system': 'RemeGen issuer release',
                  'upstream_external_id': 'remegen-news-386',
                  'upstream_title': 'Disitamab Vedotin has become the first ADC drug created and developed by a China biopharma to receive marketing approval!',
                  'published_date': '2021-06-10',
                  'original_url': 'https://www.remegen.com/index.php?cid=115&id=386&v=show',
                  'required_phrases': ['On June 9th, 2021', 'National Medical Products Administration', 'locally advanced or metastatic gastric cancer', 'HER2 over-expression'],
              },
              {
                  'key': 'remegen-urothelial-approval-date',
                  'url': 'https://www.remegen.com/index.php?cid=115&id=1731&v=show',
                  'retrieval_role': 'primary_self_statement_later_recap',
                  'upstream_system': 'RemeGen issuer clinical-results release',
                  'upstream_external_id': 'remegen-news-1731',
                  'upstream_title': 'RemeGen disitamab vedotin urothelial clinical results and China approval recap',
                  'published_date': '2023-09-12',
                  'original_url': 'https://www.remegen.com/index.php?cid=115&id=1731&v=show',
                  'required_phrases': ['approved for marketing in China by NMPA on December 31, 2021', 'urothelial carcinoma', 'HER2-overexpressing'],
              },
              {
                  'key': 'pfizer-2024-10k-disitamab-collaboration',
                  'url': 'https://investors.pfizer.com/files/doc_financials/2024/ar/10K_Final.pdf',
                  'retrieval_role': 'primary_legal_disclosure',
                  'upstream_system': 'Pfizer 2024 Form 10-K',
                  'upstream_external_id': 'pfizer-2024-form-10-k',
                  'upstream_title': 'Pfizer Inc. 2024 Form 10-K',
                  'published_date': '2025-02-27',
                  'original_url': 'https://investors.pfizer.com/files/doc_financials/2024/ar/10K_Final.pdf',
                  'required_phrases': ['disitamab vedotin', 'metastatic urothelial cancer', 'RemeGen Co., Ltd.'],
              },
              {
                  'key': 'remegen-current-pipeline-pfizer-cooperation',
                  'url': 'https://www.remegen.com/?cid=102&v=listing',
                  'retrieval_role': 'primary_self_statement_current',
                  'upstream_system': 'RemeGen current pipeline',
                  'upstream_external_id': 'remegen-pipeline-current-2026-08-22',
                  'upstream_title': 'RemeGen Pipeline - Disitamab Vedotin global programs',
                  'published_date': None,
                  'original_url': 'https://www.remegen.com/?cid=102&v=listing',
                  'required_phrases': ['Disitamab Vedotin', 'Cooperation with Pfizer', 'Urothelial Cancer'],
              },
              {
                  'key': 'clinicaltrials-sgndv001-current-sponsor',
                  'url': 'https://clinicaltrials.gov/api/v2/studies/NCT05911295',
                  'retrieval_role': 'authoritative_registry_current',
                  'upstream_system': 'ClinicalTrials.gov API',
                  'upstream_external_id': 'NCT05911295',
                  'upstream_title': 'SGNDV-001 / NCT05911295 registry record',
                  'published_date': None,
                  'original_url': 'https://clinicaltrials.gov/study/NCT05911295',
                  'required_phrases': ['NCT05911295', 'Seagen, a wholly owned subsidiary of Pfizer', 'RemeGen Co., Ltd.'],
              },
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml,application/pdf,application/json,*/*;q=0.8', 'Accept-Language': 'en-US,en;q=0.8'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  return response.read(), response.geturl(), response.status, dict(response.headers.items())

          def html_text(raw):
              decoded = raw.decode('utf-8', errors='replace')
              decoded = re.sub(r'(?is)<(script|style|noscript).*?>.*?</\\1>', ' ', decoded)
              return ' '.join(unescape(re.sub(r'<[^>]+>', ' ', decoded)).split())

          def pdf_text(raw):
              return ' '.join(' '.join((page.extract_text() or '').split()) for page in PdfReader(io.BytesIO(raw), strict=False).pages)

          rows = []
          for item in ITEMS:
              base = {'key': item['key'], 'requested_url': item['url'], 'retrieval_role': item['retrieval_role'], 'upstream_document_identity': {'system': item['upstream_system'], 'external_id': item['upstream_external_id'], 'title': item['upstream_title'], 'published_date': item['published_date'], 'original_url': item['original_url']}}
              try:
                  raw, final_url, status, headers = fetch(item['url'])
                  if status != 200:
                      raise ValueError(f'unexpected HTTP {status}')
                  content_type = (headers.get('Content-Type') or headers.get('content-type') or '').lower()
                  is_pdf = raw.startswith(b'%PDF') or 'application/pdf' in content_type
                  is_json = 'application/json' in content_type or item['url'].endswith('/NCT05911295')
                  if is_pdf:
                      text, suffix, normalized_type = pdf_text(raw), '.pdf', 'application/pdf'
                  elif is_json:
                      obj = json.loads(raw.decode('utf-8'))
                      text, suffix, normalized_type = json.dumps(obj, ensure_ascii=False, sort_keys=True), '.json', 'application/json'
                  else:
                      text, suffix, normalized_type = html_text(raw), '.html', headers.get('Content-Type') or 'text/html'
                  normalized = text.casefold()
                  missing = [p for p in item['required_phrases'] if p.casefold() not in normalized]
                  if missing:
                      raise ValueError(f'semantic identity/claim phrases missing: {missing}')
                  raw_path = Path('acquired') / f"{item['key']}{suffix}"
                  raw_path.write_bytes(raw)
                  text_path = Path('acquired') / f"{item['key']}-visible.txt"
                  text_path.write_text(text, encoding='utf-8')
                  rows.append({**base, 'ok': True, 'final_url': final_url, 'retrieval_host': urlsplit(final_url).hostname, 'status': status, 'content_type': normalized_type, 'archived_file': raw_path.name, 'raw_sha256': hashlib.sha256(raw).hexdigest(), 'raw_bytes': len(raw), 'visible_text_file': text_path.name, 'visible_text_sha256_acquisition_only': hashlib.sha256(text.encode('utf-8')).hexdigest(), 'visible_text_bytes': len(text.encode('utf-8')), 'verified_phrases': item['required_phrases']})
              except Exception as exc:
                  rows.append({**base, 'ok': False, 'error': f'{type(exc).__name__}: {exc}'})

          payload = {'schema_version': 'longcycle-approved-source-acquisition/v2', 'task_id': 'ADC-SV-004-RC48-RIGHTS-REGULATORY', 'active_head_sha': '61b5910877a50f3ee360d9cb001b262f5dc13c84', 'source_role': 'candidate primary/authoritative payload acquisition for later claim-scoped Evidence recording', 'identity_pressure': 'originator/licensee/parent-company/trial-sponsor/collaborator/territory/regulatory-state must remain distinct', 'success_count': sum(1 for row in rows if row['ok']), 'item_count': len(ITEMS), 'rows': rows}
          Path('acquired/acquisition.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          if payload['success_count'] != len(ITEMS):
              raise SystemExit('not all SV-004 source payloads passed acquisition/semantic verification')
          PY
      - name: Build deterministic immutable acquisition pack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          out = Path(f"longcycle-adc-sv004-rc48-acquisition-v2-run{os.environ['GITHUB_RUN_ID']}.zip")
          epoch = (2026, 8, 22, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(Path('acquired').rglob('*')):
                  if path.is_file():
                      info = zipfile.ZipInfo(str(path.relative_to('acquired')), date_time=epoch)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o644 << 16
                      zf.writestr(info, path.read_bytes())
          Path('release-asset.json').write_text(json.dumps({'file_name': out.name, 'size_bytes': out.stat().st_size, 'sha256': hashlib.sha256(out.read_bytes()).hexdigest()}, indent=2) + '\n')
          print(Path('release-asset.json').read_text())
          PY
      - name: Upload to shared development Release and download-back verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="$(python -c 'import json; print(json.load(open("release-asset.json"))["file_name"])')"
          expected="$(python -c 'import json; print(json.load(open("release-asset.json"))["sha256"])')"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then exit 1; fi
          gh release upload "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY"
          mkdir -p verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir verify
          test "$(sha256sum "verify/$name" | awk '{print $1}')" = "$expected"
      - name: Report acquisition result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ -f acquired/acquisition.json && -f release-asset.json ]]; then
            body=$(printf 'ADC_SV004_ACQUIRE_V2_PASS head=%s run_id=%s release=%s\n\n```json\n%s\n%s\n```' "$EXPECTED_HEAD" "$GITHUB_RUN_ID" "$RELEASE_TAG" "$(cat acquired/acquisition.json)" "$(cat release-asset.json)")
          else
            body="ADC_SV004_ACQUIRE_V2_FAIL head=$EXPECTED_HEAD run_id=$GITHUB_RUN_ID"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
