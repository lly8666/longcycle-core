name: Migrate development binary cache to Release once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write

env:
  RELEASE_TAG: longcycle-dev-binary-cache

jobs:
  migrate:
    if: github.event.issue.title == '[longcycle-migrate-dev-binary-cache-to-release-v1]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure fixed development cache release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Longcycle development binary cache' \
              --notes 'Development-stage immutable binary cache for SHA-pinned research source/replay packs. Not a production archive. Assets are restored into Actions runners or sandboxes only when needed.' \
              --prerelease
          fi

      - name: Recover existing immutable Action artifact ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          fetch_artifact_zip() {
            local artifact_id="$1"
            local output="$2"
            local expected_sha="$3"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "release-assets/$output"
            actual="$(sha256sum "release-assets/$output" | awk '{print $1}')"
            test "$actual" = "$expected_sha"
          }

          fetch_artifact_zip 9466558674 longcycle-kwinana-grounded-run19.zip 1f2ec083a79532a2283562973a31e6af3941ad8bf6e72c108692bab19a368c13
          fetch_artifact_zip 9467394803 longcycle-kemerton-grounded-run28.zip a568232b15b77696ce0a271b74fd32fb7066fb37476a58288bff68e59a00558f
          fetch_artifact_zip 9474774438 longcycle-evt003-approved-redistributor-acquisition-run32568791877.zip 76d3c74452b48de6a3ecf68b61b2ac37a4a9915ea4fece33d1f7c57ef185e0a8
          fetch_artifact_zip 9474916578 longcycle-evt003-judgment-replay-run32569365809.zip 208314238b4fc43587108a61aaf5377457acb6fd55a493a91f356aa93ef88177
          fetch_artifact_zip 9475107860 longcycle-evt004-contract-margin-acquisition-run32570106526.zip f0c31409be382d39456aaa6021576e8b07521d7e723f40d6f1969b40d32319b9
          fetch_artifact_zip 9475245274 longcycle-evt004-contract-margin-replay-run32570715478.zip 9f09929101a9645dce011b316ea7e379ca73b025cdde9f9bb72bb0e319580b01

      - name: Rebuild pinned offline DuckDB runtime for Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/wheelhouse
          python -m pip download --disable-pip-version-check --no-deps --dest runtime/wheelhouse \
            duckdb==1.5.5 pytz==2025.2
          test "$(sha256sum runtime/wheelhouse/duckdb-1.5.5-cp313-cp313-manylinux_2_26_x86_64.manylinux_2_28_x86_64.whl | awk '{print $1}')" = '078e6a60dd8eedde5832f45422ca5c4a6b8c837aeabd8a56ca0b7d933f588053'
          test "$(sha256sum runtime/wheelhouse/pytz-2025.2-py2.py3-none-any.whl | awk '{print $1}')" = '5ddf76296dd8c44c26eb8f4b6f35488f3ccbf6fbbd7adee0b7262d43f0ec2f00'
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          root = Path('runtime')
          manifest = {
              'schema_version': 'longcycle-offline-runtime-release/v1',
              'python_abi': 'cp313-x86_64-linux',
              'duckdb_version': '1.5.5',
              'pytz_version': '2025.2',
              'role': 'development sandbox replay runtime',
              'terminal_archive': False,
              'components': [],
          }
          for path in sorted((root / 'wheelhouse').iterdir()):
              raw = path.read_bytes()
              manifest['components'].append({
                  'path': str(path.relative_to(root)),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'size_bytes': len(raw),
              })
          manifest_bytes = (json.dumps(manifest, indent=2, sort_keys=True) + '\n').encode()
          (root / 'manifest.json').write_bytes(manifest_bytes)

          out = Path('release-assets/longcycle-duckdb-offline-runtime-py313-v3-release.zip')
          epoch = (2026, 8, 22, 0, 0, 0)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  info = zipfile.ZipInfo(str(path.relative_to(root)), date_time=epoch)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  zf.writestr(info, path.read_bytes())
          print(hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: Upload immutable assets to the shared development Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in release-assets/*.zip; do
            name="$(basename "$asset")"
            if grep -Fxq "$name" <<<"$existing"; then
              echo "asset already exists, verifying instead of replacing: $name"
            else
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done

      - name: Re-download every Release asset and verify SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify
          for asset in release-assets/*.zip; do
            name="$(basename "$asset")"
            expected="$(sha256sum "$asset" | awk '{print $1}')"
            rm -f "verify/$name"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir verify
            actual="$(sha256sum "verify/$name" | awk '{print $1}')"
            test "$actual" = "$expected"
          done

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path('verify').glob('*.zip')):
              raw = path.read_bytes()
              rows.append({
                  'file_name': path.name,
                  'size_bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })
          Path('release-migration-result.json').write_text(
              json.dumps({
                  'schema_version': 'longcycle-dev-release-migration/v1',
                  'release_tag': 'longcycle-dev-binary-cache',
                  'assets': rows,
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          print(Path('release-migration-result.json').read_text())
          PY

      - name: Report verified migration
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ -f release-migration-result.json ]]; then
            body=$(printf 'DEV_BINARY_RELEASE_MIGRATION_PASS run_id=%s release=%s\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$RELEASE_TAG" "$(cat release-migration-result.json)")
          else
            body="DEV_BINARY_RELEASE_MIGRATION_FAIL run_id=$GITHUB_RUN_ID release=$RELEASE_TAG"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
