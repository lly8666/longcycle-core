name: Storage Gartner PC numeric Outcome

on:
  push:
    branches:
      - design/industry-memory
    paths:
      - '.github/workflows/storage-gartner-pc-numeric-outcome.yml'
      - 'migrations/0035_standard_semantic_catalog.sql'
      - 'src/longcycle/domain/models.py'
      - 'src/longcycle/application/judgment_projection.py'
      - 'src/longcycle/application/reality_projection.py'
      - 'src/longcycle/application/numeric_outcome_evaluation.py'
      - 'scripts/execute_grounded_numeric_outcome_evaluation.py'
      - 'tests/test_postgres_mapping.py'
      - 'tests/test_numeric_outcome_projection.py'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/gartner-pc-feb-2024-growth-judgment-projection-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/gartner-pc-mar-may-2024-growth-judgment-projection-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/gartner-pc-mar-may-2024-growth-context-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/reality/gartner-pc-2024-preliminary-growth-reality-projection-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/cross-industry-demand-bridge-grounded-evidence-v1.json'
      - 'research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/ddr5-platform-device-forecast-revision-grounded-evidence-v1.json'
  pull_request:
    paths:
      - '.github/workflows/storage-gartner-pc-numeric-outcome.yml'
      - 'migrations/0035_standard_semantic_catalog.sql'
      - 'src/longcycle/domain/models.py'
      - 'src/longcycle/application/judgment_projection.py'
      - 'src/longcycle/application/reality_projection.py'
      - 'src/longcycle/application/numeric_outcome_evaluation.py'
      - 'scripts/execute_grounded_numeric_outcome_evaluation.py'
      - 'tests/test_postgres_mapping.py'
      - 'tests/test_numeric_outcome_projection.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-outcome:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.artifacts/storage-gartner-pc-blobs
      FIRST_EVIDENCE_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/cross-industry-demand-bridge-grounded-evidence-v1.json
      SECOND_EVIDENCE_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/evidence/ddr5-platform-device-forecast-revision-grounded-evidence-v1.json
      FEB_JUDGMENT_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/gartner-pc-feb-2024-growth-judgment-projection-v1.json
      MAR_MAY_JUDGMENT_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/gartner-pc-mar-may-2024-growth-judgment-projection-v1.json
      CONTEXT_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/judgments/gartner-pc-mar-may-2024-growth-context-v1.json
      REALITY_SPEC: research_data/memory/memory-semiconductors/2026-08-24-gpt-5.6-sol/self_verification/run-001/reality/gartner-pc-2024-preliminary-growth-reality-projection-v1.json
      FIRST_EVIDENCE_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-first-evidence.json
      SECOND_EVIDENCE_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-second-evidence.json
      FEB_JUDGMENT_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-feb-judgment.json
      MAR_MAY_JUDGMENT_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-mar-may-judgment.json
      CONTEXT_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-mar-may-context.json
      REALITY_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-reality.json
      FEB_OUTCOME_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-feb-outcome.json
      MAR_OUTCOME_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-mar-outcome.json
      MAY_OUTCOME_OUTPUT: ${{ github.workspace }}/.artifacts/gartner-pc-may-outcome.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,postgres,s3,duckdb]'
      - name: Numeric projection regression tests
        run: >-
          python -m pytest -q
          tests/test_postgres_mapping.py
          tests/test_numeric_outcome_projection.py
          tests/test_judgment_projection.py
          tests/test_reality_projection.py
          tests/test_outcome_evaluation.py
      - name: Migrate database
        run: longcycle --json db upgrade
      - name: Assert canonical ratio catalog bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import os
          import psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['LONGCYCLE_DATABASE_URL'], row_factory=dict_row) as conn:
              ratio = conn.execute("SELECT code,dimension FROM core.units WHERE code='ratio'").fetchone()
              predicate = conn.execute("SELECT value_kinds,temporal_mode,dimension_schema_version,required_dimensions,allowed_dimensions,canonical_unit_code FROM core.predicate_definitions WHERE code='market.pc_shipments_yoy_growth' AND active").fetchone()
          assert ratio == {'code': 'ratio', 'dimension': 'ratio'}, ratio
          assert predicate is not None, predicate
          assert predicate['value_kinds'] == ['numeric'], predicate
          assert predicate['temporal_mode'] == 'period', predicate
          assert predicate['dimension_schema_version'] == 'fact-dimensions/v1', predicate
          assert predicate['required_dimensions'] == ['statistical_scope'], predicate
          assert predicate['allowed_dimensions'] == ['statistical_scope'], predicate
          assert predicate['canonical_unit_code'] == 'ratio', predicate
          print('CANONICAL_RATIO_CATALOG_PASS')
          PY2
      - name: Re-execute first Grounded Evidence packet
        run: >-
          python scripts/execute_grounded_evidence_spec.py "$FIRST_EVIDENCE_SPEC"
          --material-root "$GITHUB_WORKSPACE" --output "$FIRST_EVIDENCE_OUTPUT"
      - name: Re-execute second Grounded Evidence packet
        run: >-
          python scripts/execute_grounded_evidence_spec.py "$SECOND_EVIDENCE_SPEC"
          --material-root "$GITHUB_WORKSPACE" --output "$SECOND_EVIDENCE_OUTPUT"
      - name: Persist February Gartner PC Judgment
        run: >-
          python scripts/execute_grounded_judgment_persistence.py "$FEB_JUDGMENT_SPEC" "$FIRST_EVIDENCE_OUTPUT"
          --output "$FEB_JUDGMENT_OUTPUT"
      - name: Persist March and May Gartner PC Judgments
        run: >-
          python scripts/execute_grounded_judgment_persistence.py "$MAR_MAY_JUDGMENT_SPEC" "$SECOND_EVIDENCE_OUTPUT"
          --output "$MAR_MAY_JUDGMENT_OUTPUT"
      - name: Persist March-to-May Judgment context
        run: >-
          python scripts/execute_grounded_judgment_context.py "$CONTEXT_SPEC" "$MAR_MAY_JUDGMENT_OUTPUT" "$SECOND_EVIDENCE_OUTPUT"
          --output "$CONTEXT_OUTPUT"
      - name: Persist preliminary Gartner PC Reality
        run: >-
          python scripts/execute_grounded_reality_projection.py "$REALITY_SPEC" "$SECOND_EVIDENCE_OUTPUT"
          --output "$REALITY_OUTPUT"
      - name: Evaluate February numeric Outcome
        run: >-
          python scripts/execute_grounded_numeric_outcome_evaluation.py "$FEB_JUDGMENT_OUTPUT" "$REALITY_OUTPUT"
          --judgment-key gartner-pc-growth-2024-02 --reality-fact-key gartner-pc-growth-2024-preliminary
          --output "$FEB_OUTCOME_OUTPUT"
      - name: Evaluate March numeric Outcome
        run: >-
          python scripts/execute_grounded_numeric_outcome_evaluation.py "$MAR_MAY_JUDGMENT_OUTPUT" "$REALITY_OUTPUT"
          --judgment-key gartner-pc-growth-2024-03 --reality-fact-key gartner-pc-growth-2024-preliminary
          --output "$MAR_OUTCOME_OUTPUT"
      - name: Evaluate May numeric Outcome
        run: >-
          python scripts/execute_grounded_numeric_outcome_evaluation.py "$MAR_MAY_JUDGMENT_OUTPUT" "$REALITY_OUTPUT"
          --judgment-key gartner-pc-growth-2024-05 --reality-fact-key gartner-pc-growth-2024-preliminary
          --output "$MAY_OUTCOME_OUTPUT"
      - name: Assert point-in-time numeric Outcome acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import json, os
          from decimal import Decimal
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row
          def load(name): return json.loads(Path(os.environ[name]).read_text(encoding='utf-8'))
          feb_j=load('FEB_JUDGMENT_OUTPUT'); mm_j=load('MAR_MAY_JUDGMENT_OUTPUT'); ctx=load('CONTEXT_OUTPUT'); reality=load('REALITY_OUTPUT')
          judgments=feb_j['judgments']+mm_j['judgments']; by_key={x['metadata']['judgment_key']:x for x in judgments}
          expected={'gartner-pc-growth-2024-02':Decimal('0.035'),'gartner-pc-growth-2024-03':Decimal('0.024'),'gartner-pc-growth-2024-05':Decimal('0.024')}
          for key,value in expected.items():
              x=by_key[key]; assert x['value_kind']=='numeric'; assert Decimal(str(x['value_numeric']))==value; assert x['unit_code']=='ratio'; assert x['predicate_code']=='market.pc_shipments_yoy_growth'; assert x['dimensions_complete'] is True
          assert ctx['verification']['relation_count']==1, ctx
          assert ctx['relations'][0]['relation_type']=='reaffirms', ctx
          ids=[x['id'] for x in judgments]
          with psycopg.connect(os.environ['LONGCYCLE_DATABASE_URL'],row_factory=dict_row) as conn:
              rows=conn.execute('SELECT id,value_kind,value_numeric,unit_code,predicate_code,comparability_hash,dimensions_complete FROM research.judgment_assertions WHERE id = ANY(%s::uuid[])',(ids,)).fetchall()
          assert len(rows)==3, rows
          for row in rows:
              assert row['value_kind']=='numeric'; assert row['value_numeric'] is not None; assert row['unit_code']=='ratio'; assert row['predicate_code']=='market.pc_shipments_yoy_growth'; assert row['comparability_hash'] is not None; assert row['dimensions_complete'] is True
          fact=reality['facts'][0]['fact']; assert Decimal(str(fact['normalized_number']))==Decimal('0.013'); assert fact['normalized_unit']=='ratio'; assert fact['known_at']=='2025-01-16T00:00:00Z'; assert reality['verification']['canonical_reality_count']==1
          for name,error in [('FEB_OUTCOME_OUTPUT',Decimal('-0.022')),('MAR_OUTCOME_OUTPUT',Decimal('-0.011')),('MAY_OUTCOME_OUTPUT',Decimal('-0.011'))]:
              p=load(name); e=p['evaluation']; assert e['semantic_relation']=='direct_match'; assert e['evaluation_status']=='indeterminate'; assert Decimal(str(e['numeric_error']))==error; assert e['outcome_first_known_at']=='2025-01-16T00:00:00Z'; assert p['verification']['predicate_dimensions_unit_match_required'] is True; assert p['verification']['no_correctness_tolerance_inferred'] is True
          print('STORAGE_GARTNER_PC_NUMERIC_OUTCOME_PASS')
          PY2
      - name: Upload typed execution receipts
        uses: actions/upload-artifact@v4
        with:
          name: storage-gartner-pc-numeric-outcome-${{ github.run_id }}
          path: |
            ${{ env.FIRST_EVIDENCE_OUTPUT }}
            ${{ env.SECOND_EVIDENCE_OUTPUT }}
            ${{ env.FEB_JUDGMENT_OUTPUT }}
            ${{ env.MAR_MAY_JUDGMENT_OUTPUT }}
            ${{ env.CONTEXT_OUTPUT }}
            ${{ env.REALITY_OUTPUT }}
            ${{ env.FEB_OUTCOME_OUTPUT }}
            ${{ env.MAR_OUTCOME_OUTPUT }}
            ${{ env.MAY_OUTCOME_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
