name: One-shot legacy portable memory compatibility patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: >-
      github.event.issue.title == '[longcycle-legacy-portable-memory-compat-patch-v1]' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve exact target head
        id: resolve
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          head_sha="$(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^head=([0-9a-f]{40})$/\1/p' | head -n1)"
          test -n "$head_sha" || { echo 'missing exact head=<40 lowercase hex> line' >&2; exit 2; }
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: design/industry-memory
          fetch-depth: 0

      - name: Guard branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.resolve.outputs.head_sha }}'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply bounded additive-read compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          reader_path = Path('src/longcycle/adapters/storage/duckdb_epistemic.py')
          text = reader_path.read_text(encoding='utf-8')

          old_context = '''            judgment_id_index = judgment_columns.index("judgment_id")
            judgment_ids = [row[judgment_id_index] for row in judgment_rows]
            rationale_rows: list[tuple[Any, ...]] = []
            rationale_columns: list[str] = []
            relation_rows: list[tuple[Any, ...]] = []
            relation_columns: list[str] = []
            if judgment_ids:
                placeholders = ", ".join("?" for _ in judgment_ids)
                rationale_clause = f"judgment_id IN ({placeholders})"
                rationale_params: list[Any] = list(judgment_ids)
                relation_clause = (
                    f"from_judgment_id IN ({placeholders}) "
                    f"AND to_judgment_id IN ({placeholders})"
                )
                relation_params: list[Any] = [*judgment_ids, *judgment_ids]
                if cutoff is not None:
                    rationale_clause += " AND known_at <= ?"
                    rationale_params.append(cutoff)
                    relation_clause += " AND known_at <= ?"
                    relation_params.append(cutoff)
                rationale_rows = connection.execute(
                    f"""
                    SELECT * FROM judgment_rationale_memory
                    WHERE {rationale_clause}
                    ORDER BY known_at, judgment_id, ordinal, rationale_id
                    """,
                    rationale_params,
                ).fetchall()
                rationale_columns = [column[0] for column in connection.description]
                relation_rows = connection.execute(
                    f"""
                    SELECT * FROM judgment_relation_memory
                    WHERE {relation_clause}
                    ORDER BY known_at, from_judgment_id, to_judgment_id, relation_type
                    """,
                    relation_params,
                ).fetchall()
                relation_columns = [column[0] for column in connection.description]
          '''
          new_context = '''            judgment_id_index = judgment_columns.index("judgment_id")
            judgment_ids = [row[judgment_id_index] for row in judgment_rows]
            table_names = {row[0] for row in connection.execute("SHOW TABLES").fetchall()}
            rationale_rows: list[tuple[Any, ...]] = []
            rationale_columns: list[str] = []
            relation_rows: list[tuple[Any, ...]] = []
            relation_columns: list[str] = []
            if judgment_ids and "judgment_rationale_memory" in table_names:
                placeholders = ", ".join("?" for _ in judgment_ids)
                rationale_clause = f"judgment_id IN ({placeholders})"
                rationale_params: list[Any] = list(judgment_ids)
                if cutoff is not None:
                    rationale_clause += " AND known_at <= ?"
                    rationale_params.append(cutoff)
                rationale_rows = connection.execute(
                    f"""
                    SELECT * FROM judgment_rationale_memory
                    WHERE {rationale_clause}
                    ORDER BY known_at, judgment_id, ordinal, rationale_id
                    """,
                    rationale_params,
                ).fetchall()
                rationale_columns = [column[0] for column in connection.description]
            if judgment_ids and "judgment_relation_memory" in table_names:
                placeholders = ", ".join("?" for _ in judgment_ids)
                relation_clause = (
                    f"from_judgment_id IN ({placeholders}) "
                    f"AND to_judgment_id IN ({placeholders})"
                )
                relation_params: list[Any] = [*judgment_ids, *judgment_ids]
                if cutoff is not None:
                    relation_clause += " AND known_at <= ?"
                    relation_params.append(cutoff)
                relation_rows = connection.execute(
                    f"""
                    SELECT * FROM judgment_relation_memory
                    WHERE {relation_clause}
                    ORDER BY known_at, from_judgment_id, to_judgment_id, relation_type
                    """,
                    relation_params,
                ).fetchall()
                relation_columns = [column[0] for column in connection.description]
          '''
          if text.count(old_context) != 1:
              raise SystemExit('expected exactly one judgment-context read block')
          text = text.replace(old_context, new_context)

          old_observed = '''            observed_time=(
                TemporalExtent(
                    kind="instant",
                    at=row["observed_at"],
                    precision=TemporalPrecision(row["observed_at_precision"]),
                    source_text=row["observed_at_text"],
                )
                if row["observed_at"] is not None
                else None
            ),
          '''
          new_observed = '''            observed_time=(
                TemporalExtent(
                    kind="instant",
                    at=row.get("observed_at"),
                    precision=TemporalPrecision(
                        row.get("observed_at_precision", TemporalPrecision.UNKNOWN.value)
                    ),
                    source_text=row.get("observed_at_text"),
                )
                if row.get("observed_at") is not None
                else None
            ),
          '''
          if text.count(old_observed) != 1:
              raise SystemExit('expected exactly one observed-time read block')
          text = text.replace(old_observed, new_observed)
          reader_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_epistemic_memory.py')
          test_text = test_path.read_text(encoding='utf-8')
          marker = 'async def test_duckdb_memory_reader_restores_legacy_additive_v1'
          if marker in test_text:
              raise SystemExit('legacy compatibility test already exists')
          test_text += '''\n\n@pytest.mark.asyncio\nasync def test_duckdb_memory_reader_restores_legacy_additive_v1(tmp_path) -> None:\n    import duckdb\n\n    path = tmp_path / "legacy-industrial-memory.duckdb"\n    timeline = _timeline()\n    seal_industrial_memory(path, timeline)\n\n    connection = duckdb.connect(str(path))\n    try:\n        connection.execute("DROP TABLE judgment_rationale_memory")\n        connection.execute("DROP TABLE judgment_relation_memory")\n        connection.execute("ALTER TABLE reality_memory DROP COLUMN observed_at")\n        connection.execute("ALTER TABLE reality_memory DROP COLUMN observed_at_precision")\n        connection.execute("ALTER TABLE reality_memory DROP COLUMN observed_at_text")\n        connection.execute("CHECKPOINT")\n    finally:\n        connection.close()\n\n    reader = DuckDBEpistemicMemoryReader(path)\n    restored = await reader.timeline((SUBJECT,))\n    assert restored.judgment_rationales == ()\n    assert restored.judgment_relations == ()\n    assert len(restored.judgments) == 2\n    assert len(restored.reality) == 1\n    assert restored.reality[0].observed_time is None\n    assert len(restored.outcomes) == 1\n\n    before = await reader.snapshot(\n        (SUBJECT,),\n        knowledge_cutoff=datetime(2022, 8, 3, 16, 27, 48, tzinfo=UTC),\n    )\n    assert len(before.judgments) == 1\n    assert before.reality == ()\n    assert before.outcomes == ()\n\n    at = await reader.snapshot((SUBJECT,), knowledge_cutoff=OUTCOME_KNOWN)\n    assert len(at.judgments) == 2\n    assert len(at.reality) == 1\n    assert at.reality[0].observed_time is None\n    assert len(at.outcomes) == 1\n'''
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -e '.[dev,duckdb]'

      - name: Targeted compatibility tests
        run: python -m pytest -q tests/test_epistemic_memory.py tests/test_cli_research.py

      - name: Type check storage adapter
        run: python -m mypy src/longcycle/adapters/storage/duckdb_epistemic.py

      - name: Commit compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/longcycle/adapters/storage/duckdb_epistemic.py tests/test_epistemic_memory.py
          git diff --cached --check
          git commit -m 'fix: read additive legacy portable memory'
          git push origin HEAD:design/industry-memory
          echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report patch result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          body=$(printf 'LEGACY_PORTABLE_MEMORY_PATCH outcome=%s new_head=%s run_id=%s' '${{ job.status }}' "${new_head:-not_committed}" "$GITHUB_RUN_ID")
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
