name: ci

on:
  push:
    branches:
      - main
      - design/industry-memory
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,postgres,s3]"

      - name: Ruff (diagnostic during memory campaign)
        id: ruff
        continue-on-error: true
        run: ruff check .

      - name: Mypy
        id: mypy
        continue-on-error: true
        run: mypy src

      - name: Pytest
        id: pytest
        continue-on-error: true
        run: pytest -q

      - name: Correctness gate
        if: always()
        run: |
          echo "ruff=${{ steps.ruff.outcome }} (diagnostic only during the memory campaign)"
          echo "mypy=${{ steps.mypy.outcome }}"
          echo "pytest=${{ steps.pytest.outcome }}"
          test "${{ steps.mypy.outcome }}" = "success"
          test "${{ steps.pytest.outcome }}" = "success"
