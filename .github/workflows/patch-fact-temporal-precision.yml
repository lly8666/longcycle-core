name: Patch fact temporal precision

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[patch-fact-temporal-precision-v1]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark start
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'FACT_TEMPORAL_PRECISION_PATCH_START'
            })

      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: design/industry-memory
          fetch-depth: 0

      - name: Patch FactAssertion domain model
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/longcycle/domain/models.py')
          text = path.read_text(encoding='utf-8')

          old = '''    TaxBasis,\n    ValidTimeKind,\n)'''
          new = '''    TaxBasis,\n    TemporalPrecision,\n    ValidTimeKind,\n)'''
          if text.count(old) != 1:
              raise SystemExit(f'import anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    valid_time_kind: ValidTimeKind = ValidTimeKind.UNKNOWN\n    valid_time: TimeRange = Field(default_factory=TimeRange)\n    observed_at: datetime | None = None'''
          new = '''    valid_time_kind: ValidTimeKind = ValidTimeKind.UNKNOWN\n    valid_time: TimeRange = Field(default_factory=TimeRange)\n    valid_time_precision: TemporalPrecision = TemporalPrecision.UNKNOWN\n    valid_time_text: str | None = None\n    observed_at: datetime | None = None'''
          if text.count(old) != 1:
              raise SystemExit(f'field anchor count={text.count(old)}')
          text = text.replace(old, new)

          old = '''    @field_validator("value_type", mode="before")\n    @classmethod\n    def normalize_value_kind(cls, value: Any) -> Any:\n        return FactValueKind.NUMERIC.value if value == "number" else value\n\n    @property\n    def scope_key(self) -> str:'''
          new = '''    @field_validator("value_type", mode="before")\n    @classmethod\n    def normalize_value_kind(cls, value: Any) -> Any:\n        return FactValueKind.NUMERIC.value if value == "number" else value\n\n    @model_validator(mode="before")\n    @classmethod\n    def restore_and_mirror_valid_time_precision(cls, value: Any) -> Any:\n        if not isinstance(value, dict):\n            return value\n        payload = dict(value)\n        metadata = dict(payload.get("metadata") or {})\n        precision_key = "_longcycle_valid_time_precision"\n        text_key = "_longcycle_valid_time_text"\n        if "valid_time_precision" not in payload and precision_key in metadata:\n            payload["valid_time_precision"] = metadata[precision_key]\n        if "valid_time_text" not in payload and text_key in metadata:\n            payload["valid_time_text"] = metadata[text_key]\n        precision = payload.get("valid_time_precision", TemporalPrecision.UNKNOWN)\n        precision_value = precision.value if isinstance(precision, TemporalPrecision) else str(precision)\n        metadata[precision_key] = precision_value\n        source_text = payload.get("valid_time_text")\n        if source_text is not None:\n            metadata[text_key] = source_text\n        else:\n            metadata.pop(text_key, None)\n        payload["metadata"] = metadata\n        return payload\n\n    @model_validator(mode="after")\n    def valid_time_precision_matches_semantics(self) -> "FactAssertion":\n        bounded = {\n            TemporalPrecision.INSTANT,\n            TemporalPrecision.SECOND,\n            TemporalPrecision.MINUTE,\n            TemporalPrecision.HOUR,\n            TemporalPrecision.DAY,\n            TemporalPrecision.WEEK,\n            TemporalPrecision.MONTH,\n            TemporalPrecision.QUARTER,\n            TemporalPrecision.HALF_YEAR,\n            TemporalPrecision.YEAR,\n            TemporalPrecision.RANGE,\n        }\n        if self.valid_time_precision in bounded and self.valid_time_kind != ValidTimeKind.PERIOD:\n            raise ValueError("bounded fact valid-time precision requires period valid_time_kind")\n        if self.valid_time_precision == TemporalPrecision.APPROXIMATE and not self.valid_time_text:\n            raise ValueError("approximate fact valid time must preserve the source time text")\n        if self.valid_time_kind == ValidTimeKind.PERIOD and (\n            self.valid_time.start is None and self.valid_time.end is None\n        ):\n            raise ValueError("period fact valid time requires a start and/or end bound")\n        return self\n\n    @property\n    def scope_key(self) -> str:'''
          if text.count(old) != 1:
              raise SystemExit(f'validator anchor count={text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name longcycle-runtime-broker
          git config user.email actions@users.noreply.github.com
          git add src/longcycle/domain/models.py
          git diff --cached --check
          git commit -m "feat: preserve fact valid-time precision"
          git push origin HEAD:design/industry-memory

      - name: Mark success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'FACT_TEMPORAL_PRECISION_PATCH_PASS'
            })

      - name: Mark failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'FACT_TEMPORAL_PRECISION_PATCH_FAIL'
            })
