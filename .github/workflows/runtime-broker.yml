name: Longcycle bounded runtime broker

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ACTIVE_REF: design/industry-memory

jobs:
  grounded-evidence-v1:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[longcycle-kwinana-real-archive-v1]' ||
      github.event.issue.title == '[longcycle-kemerton-grounded-v1]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.longcycle/action-blobs
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Select bounded grounded-evidence task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$ISSUE_TITLE" == "[longcycle-kwinana-real-archive-v1]" ]]; then
            echo 'RUN_LABEL=kwinana' >> "$GITHUB_ENV"
            echo 'SPEC_PATH=research_data/memory/lithium-battery/2026-08-21-gpt-5.6-sol/self_verification/UP-CHEMICALS/run-001/tasks/EVT-001-kwinana-evidence-spec-v1.json' >> "$GITHUB_ENV"
          elif [[ "$ISSUE_TITLE" == "[longcycle-kemerton-grounded-v1]" ]]; then
            echo 'RUN_LABEL=kemerton' >> "$GITHUB_ENV"
            echo 'SPEC_PATH=research_data/memory/lithium-battery/2026-08-21-gpt-5.6-sol/self_verification/UP-CHEMICALS/run-001/tasks/EVT-002-kemerton-evidence-spec-v2.json' >> "$GITHUB_ENV"
          else
            echo 'unsupported grounded-evidence trigger' >&2
            exit 2
          fi

      - name: Check out active branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          git rev-parse HEAD > probe/active-head.txt
          printf '%s\n' "$GITHUB_RUN_ID" > probe/run-id.txt
          printf '%s\n' "$RUN_LABEL" > probe/run-label.txt
          printf '%s\n' "$SPEC_PATH" > probe/spec-path.txt
          python -m pip install -e '.[postgres,duckdb]'

      - name: Migrate database
        shell: bash
        run: |
          set -uo pipefail
          if ! longcycle --json db upgrade > probe/migrations.json 2> probe/migrations.stderr; then
            echo 'stage=migrations' > probe/runtime-stage-error.txt
            exit 1
          fi
          if ! longcycle --json doctor --check-database > probe/doctor.json 2> probe/doctor.stderr; then
            echo 'stage=database-doctor' > probe/runtime-stage-error.txt
            exit 1
          fi

      - name: Execute grounded evidence
        shell: bash
        run: |
          set -uo pipefail
          if ! python scripts/execute_grounded_evidence_spec.py "$SPEC_PATH" \
            --output probe/grounded-evidence-execution.json \
            > probe/execution.stdout 2> probe/execution.stderr; then
            echo 'stage=grounded-evidence-execution' > probe/runtime-stage-error.txt
            exit 1
          fi

      - name: Export portable DuckDB
        shell: bash
        run: |
          set -uo pipefail
          if ! python scripts/export_portable_evidence_duckdb.py \
            probe/grounded-evidence-execution.json \
            "probe/${RUN_LABEL}-evidence.duckdb" \
            --manifest-output probe/duckdb-export.json \
            > probe/duckdb.stdout 2> probe/duckdb.stderr; then
            echo 'stage=duckdb-export' > probe/runtime-stage-error.txt
            exit 1
          fi

      - name: Enforce blind-memory immutability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- research_data/memory/lithium-battery/2026-08-21-gpt-5.6-sol/blind)" ]]; then
            echo 'stage=blind-memory-immutability' > probe/runtime-stage-error.txt
            exit 1
          fi

      - name: Build report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def read(path: str, default: str = 'unknown') -> str:
              item = Path(path)
              return item.read_text(encoding='utf-8', errors='replace').strip() if item.exists() else default

          lines = [
              f'# {read("probe/run-label.txt").title()} grounded evidence + DuckDB bundle v1',
              '',
              f'- workflow run: `{read("probe/run-id.txt")}`',
              f'- active branch HEAD: `{read("probe/active-head.txt")}`',
              f'- spec: `{read("probe/spec-path.txt")}`',
          ]
          if Path('probe/runtime-stage-error.txt').exists():
              lines += ['', f'- runtime failure: `{read("probe/runtime-stage-error.txt")}`']
              for path in ('probe/execution.stdout', 'probe/execution.stderr', 'probe/duckdb.stdout', 'probe/duckdb.stderr', 'probe/migrations.stderr', 'probe/doctor.stderr'):
                  value = read(path, '')
                  if value:
                      lines += ['', f'### {path}', '', '```text', value[-6000:], '```']
          execution_path = Path('probe/grounded-evidence-execution.json')
          if execution_path.exists():
              payload = json.loads(execution_path.read_text(encoding='utf-8'))
              if payload.get('ok'):
                  result = payload['result']
                  acceptance = result['acceptance']
                  lines += [
                      '',
                      f'- task: `{result["task_id"]}`',
                      f'- documents: {len(result["documents"])}',
                      f'- artifacts: {len(result["artifacts"])}',
                      f'- evidence fragments: {len(result["fragments"])}',
                      f'- FactAssertions created: {acceptance["fact_assertions_created"]}',
                      f'- Judgments created: {acceptance["judgment_assertions_created"]}',
                      '',
                  ]
                  for row in result['documents']:
                      lines.append(f'- `{row["document_key"]}` raw sha256 `{row["content_sha256"]}` bytes={row["byte_length"]}')
                  lines += ['', '### Grounding artifacts', '']
                  for row in result['artifacts']:
                      lines.append(f'- `{row["document_key"]}` `{row["artifact_type"]}` sha256 `{row["artifact_sha256"]}`')
                  lines += ['', '### Evidence locators', '']
                  for row in result['fragments']:
                      lines.append(f'- `{row["fragment_key"]}` → `{row["locator"]}` / `{row["fragment_sha256"]}`')
          duck_path = Path('probe/duckdb-export.json')
          if duck_path.exists():
              payload = json.loads(duck_path.read_text(encoding='utf-8'))
              verification = payload.get('verification', {})
              lines += [
                  '',
                  '## Portable DuckDB bundle',
                  '',
                  f'- DuckDB: {payload.get("duckdb_version")}',
                  f'- file bytes: {payload.get("file_bytes")}',
                  f'- file sha256: `{payload.get("file_sha256")}`',
                  f'- read-only open seconds: {verification.get("read_only_open_seconds")}',
                  f'- point-in-time query seconds: {verification.get("point_in_time_query_seconds")}',
                  f'- broken document refs: {verification.get("broken_document_refs")}',
                  f'- broken artifact refs: {verification.get("broken_artifact_refs")}',
                  f'- claim roles: `{json.dumps(verification.get("claim_role_counts", {}), ensure_ascii=False, sort_keys=True)}`',
              ]
          Path('probe/report.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat probe/report.md

      - name: Upload transport artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounded-evidence-v1-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            probe/
            .longcycle/action-blobs/

      - name: Comment report
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file probe/report.md

  kemerton-archive-v1:
    if: github.event_name == 'issues' && github.event.issue.title == '[longcycle-kemerton-archive-v1]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.longcycle/action-blobs
      PLAN_PATH: research_data/memory/lithium-battery/2026-08-21-gpt-5.6-sol/self_verification/UP-CHEMICALS/run-001/tasks/EVT-002-kemerton-archive-plan-v1.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Execute archive plan
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[postgres]'
          mkdir -p probe
          git rev-parse HEAD > probe/active-head.txt
          printf '%s\n' "$GITHUB_RUN_ID" > probe/run-id.txt
          longcycle --json db upgrade > probe/migrations.json
          python scripts/execute_archive_plan.py "$PLAN_PATH" --output probe/kemerton-archive-execution.json
          test -z "$(git status --porcelain -- research_data/memory/lithium-battery/2026-08-21-gpt-5.6-sol/blind)"
      - name: Build archive report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run_id = Path('probe/run-id.txt').read_text().strip() if Path('probe/run-id.txt').exists() else 'unknown'
          head = Path('probe/active-head.txt').read_text().strip() if Path('probe/active-head.txt').exists() else 'unknown'
          lines = ['# Kemerton archive execution v1', '', f'- workflow run: `{run_id}`', f'- active branch HEAD: `{head}`']
          path = Path('probe/kemerton-archive-execution.json')
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              if payload.get('ok'):
                  result = payload['result']
                  acceptance = result['acceptance']
                  lines += ['', f'- archived vintages: {acceptance["archived_vintages"]}', f'- FactAssertions created: {acceptance["fact_assertions_created"]}', f'- Judgments created: {acceptance["judgment_assertions_created"]}', '']
                  for row in result['documents']:
                      lines.append(f'- `{row["vintage_id"]}` sha256 `{row["content_sha256"]}` bytes={row["byte_length"]} type={row["content_type"]}')
              else:
                  lines += ['', f'- execution failed: `{payload.get("error")}`']
          Path('probe/report.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat probe/report.md
      - name: Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kemerton-archive-v1-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            probe/
            .longcycle/action-blobs/
      - name: Comment archive report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file probe/report.md
