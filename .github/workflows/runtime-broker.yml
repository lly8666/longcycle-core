name: Longcycle bounded runtime broker

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ACTIVE_REF: design/industry-memory
  SPEC_PATH: research_data/memory/lithium-battery/2026-08-21-gpt-5.6-sol/self_verification/UP-CHEMICALS/run-001/tasks/EVT-001-kwinana-evidence-spec-v1.json

jobs:
  kwinana-grounded-evidence-v1:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[longcycle-kwinana-real-archive-v1]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: longcycle
          POSTGRES_PASSWORD: longcycle
          POSTGRES_DB: longcycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U longcycle -d longcycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@127.0.0.1:5432/longcycle
      LONGCYCLE_BLOB_BACKEND: filesystem
      LONGCYCLE_BLOB_ROOT: ${{ github.workspace }}/.longcycle/action-blobs
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out active Longcycle branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact benchmark runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[postgres,duckdb]'
          mkdir -p probe
          git rev-parse HEAD | tee probe/active-head.txt
          python - <<'PY'
          import duckdb, pypdf
          print('DUCKDB_VERSION', duckdb.__version__)
          print('PYPDF_VERSION', pypdf.__version__)
          PY

      - name: Apply normal Longcycle migrations
        shell: bash
        run: |
          set -euo pipefail
          longcycle --json db upgrade | tee probe/migrations.json
          longcycle --json doctor --check-database | tee probe/doctor.json

      - name: Execute four-document nine-fragment grounded evidence spec
        shell: bash
        run: |
          set -euo pipefail
          python scripts/execute_grounded_evidence_spec.py "$SPEC_PATH" \
            --output probe/grounded-evidence-execution.json

      - name: Export and verify portable DuckDB evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_portable_evidence_duckdb.py \
            probe/grounded-evidence-execution.json \
            probe/kwinana-evidence.duckdb \
            --manifest-output probe/duckdb-export.json

      - name: Enforce sealed blind-memory immutability
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- research_data/memory/lithium-battery/2026-08-21-gpt-5.6-sol/blind)"

      - name: Build compact human review report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          execution_path=Path('probe/grounded-evidence-execution.json')
          duck_path=Path('probe/duckdb-export.json')
          lines=['# Kwinana grounded evidence + DuckDB bundle v1','']
          if Path('probe/active-head.txt').exists():
              lines += [f'Active branch HEAD: `{Path("probe/active-head.txt").read_text().strip()}`','']
          if execution_path.exists():
              payload=json.load(open(execution_path,encoding='utf-8'))
              result=payload.get('result',{})
              lines += ['## Grounded evidence','']
              lines.append(f'- documents: {len(result.get("documents", []))}')
              lines.append(f'- artifacts: {len(result.get("artifacts", []))}')
              lines.append(f'- evidence fragments: {len(result.get("fragments", []))}')
              acceptance=result.get('acceptance',{})
              lines.append(f'- FactAssertions created: {acceptance.get("fact_assertions_created")}')
              lines.append(f'- Judgments created: {acceptance.get("judgment_assertions_created")}')
              lines.append('')
              for row in result.get('documents',[]):
                  lines.append(f'- `{row["document_key"]}` sha256 `{row["content_sha256"]}` bytes={row["byte_length"]}')
              lines += ['', '### Evidence locators','']
              for row in result.get('fragments',[]):
                  lines.append(f'- `{row["fragment_key"]}` → `{row["locator"]}` / `{row["fragment_sha256"]}`')
          else:
              lines += ['## Grounded evidence','', '- execution output missing; inspect job logs','']
          if duck_path.exists():
              payload=json.load(open(duck_path,encoding='utf-8'))
              lines += ['', '## Portable DuckDB bundle','']
              lines.append(f'- DuckDB: {payload.get("duckdb_version")}')
              lines.append(f'- file bytes: {payload.get("file_bytes")}')
              lines.append(f'- file sha256: `{payload.get("file_sha256")}`')
              verification=payload.get('verification',{})
              lines.append(f'- read-only open seconds: {verification.get("read_only_open_seconds")}')
              lines.append(f'- point-in-time query seconds: {verification.get("point_in_time_query_seconds")}')
              lines.append(f'- known by 2021 year-end: {verification.get("evidence_known_by_2021_year_end")} fragments')
              lines.append(f'- broken document refs: {verification.get("broken_document_refs")}')
              lines.append(f'- broken artifact refs: {verification.get("broken_artifact_refs")}')
              lines.append(f'- claim roles: `{json.dumps(verification.get("claim_role_counts",{}),ensure_ascii=False,sort_keys=True)}`')
          else:
              lines += ['', '## Portable DuckDB bundle','', '- export output missing; inspect job logs','']
          Path('probe/report.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          cat probe/report.md

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kwinana-grounded-evidence-duckdb-v1
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            probe/
            .longcycle/action-blobs/

      - name: Comment result back to trigger issue
        if: always() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file probe/report.md
