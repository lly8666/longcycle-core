name: Longcycle bounded claim-context grounding repair

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  ACTIVE_REF: design/industry-memory

jobs:
  repair:
    if: github.event.issue.title == '[longcycle-fix-claim-context-grounding-v1]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTIVE_REF }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pipeline = Path('src/longcycle/application/pipeline.py')
          text = pipeline.read_text(encoding='utf-8')
          old_sig = '''    def _validate_textual_grounding(\n        document: SourceDocument,\n        evidence: Sequence[object],\n        content: bytes | None,\n    ) -> None:\n'''
          new_sig = '''    def _validate_textual_grounding(\n        document: SourceDocument,\n        evidence: Sequence[object],\n        content: bytes | None,\n        *,\n        allow_claim_context_annotation: bool = False,\n    ) -> None:\n'''
          if text.count(old_sig) != 1:
              raise SystemExit('pipeline signature anchor count != 1')
          text = text.replace(old_sig, new_sig)

          old_guard = '''            if structured_payload is not None and getattr(fragment, "artifact_id", None) is None:\n                raise ValueError(\n                    "structured evidence requires JSON or a persisted parser artifact"\n                )\n'''
          new_guard = '''            annotation_only = (\n                allow_claim_context_annotation\n                and isinstance(structured_payload, dict)\n                and set(structured_payload) == {"claim_context"}\n                and isinstance(structured_payload.get("claim_context"), dict)\n                and bool(structured_payload["claim_context"])\n            )\n            if (\n                structured_payload is not None\n                and getattr(fragment, "artifact_id", None) is None\n                and not annotation_only\n            ):\n                raise ValueError(\n                    "structured evidence requires JSON or a persisted parser artifact"\n                )\n'''
          if text.count(old_guard) != 1:
              raise SystemExit('pipeline structured-evidence guard anchor count != 1')
          text = text.replace(old_guard, new_guard)
          pipeline.write_text(text, encoding='utf-8')

          recorder = Path('src/longcycle/application/evidence_recording.py')
          text = recorder.read_text(encoding='utf-8')
          old_call = '''        CollectionPipeline._validate_textual_grounding(\n            document,\n            (fragment,),\n            content,\n        )\n'''
          new_call = '''        CollectionPipeline._validate_textual_grounding(\n            document,\n            (fragment,),\n            content,\n            allow_claim_context_annotation=True,\n        )\n'''
          if text.count(old_call) != 1:
              raise SystemExit('recorder grounding-call anchor count != 1')
          text = text.replace(old_call, new_call)
          recorder.write_text(text, encoding='utf-8')
          PY

      - name: Install and run focused regression
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_evidence_claim_context.py tests/test_evidence_recording.py
          mypy src

      - name: Commit and push repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/longcycle/application/pipeline.py src/longcycle/application/evidence_recording.py
          git commit -m 'evidence: distinguish claim context from structured extraction'
          git push origin HEAD:${ACTIVE_REF}
          sha=$(git rev-parse HEAD)
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "CLAIM_CONTEXT_GROUNDING_REPAIR_PUSHED commit=$sha"
