[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "longcycle-core"
version = "0.1.0"
description = "Extensible data and collection core for industry-cycle research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf==6.15.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
longcycle = "longcycle.cli:main"

[project.entry-points."longcycle.sources"]
local_folder = "longcycle.adapters.sources.local:LocalFolderSource"
http_document = "longcycle.adapters.sources.http:HttpDocumentSource"

[tool.hatch.build.targets.wheel]
packages = ["src/longcycle"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "longcycle/sql_migrations"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "longcycle.adapters.storage.postgres"
# Temporary, narrowly scoped to one legacy row-mapping key narrowing at the
# bottom of the large adapter. Remove after that line is patched directly.
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
