name: longcycle-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: longcycle
      POSTGRES_USER: longcycle
      POSTGRES_PASSWORD: longcycle
    ports:
      - "${LONGCYCLE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - longcycle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longcycle -d longcycle"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: longcycle
      MINIO_ROOT_PASSWORD: longcycle-development-only
    ports:
      - "${LONGCYCLE_MINIO_PORT:-9000}:9000"
      - "${LONGCYCLE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - longcycle-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 longcycle longcycle-development-only; do sleep 2; done
        mc mb --ignore-existing local/longcycle-raw
        mc version enable local/longcycle-raw
    restart: "no"

  migrate:
    build: .
    environment:
      LONGCYCLE_DATABASE_URL: postgresql://longcycle:longcycle@postgres:5432/longcycle
    depends_on:
      postgres:
        condition: service_healthy
    command: ["db", "upgrade"]
    restart: "no"

volumes:
  longcycle-postgres:
  longcycle-minio:
